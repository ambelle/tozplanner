name: Update DreamMS character levels

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-characters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest DreamMS character data
        run: node scripts/update-characters.js
      - name: Commit updated character data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add characters.json
          git diff --cached --quiet || git commit -m "Update DreamMS character levels"
          git push
