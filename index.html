<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamMS TOZ Train Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DreamMS · Tower of ToZ</p>
      <h1>TOZ Train Manager</h1>
      <p class="subtitle">7-round party planner with role checks, availability, suggestions, and character tracking.</p>
    </div>
    <div class="actions">
      <button id="saveBtn">Save</button>
      <button id="exportBtn">Export</button>
      <label class="importBtn">Import<input id="importInput" type="file" accept="application/json" /></label>
      <button id="resetBtn" class="danger">Reset</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel lobbyPanel">
      <div class="panelHead">
        <div>
          <h2>Player Lobby</h2>
          <p>Drag players into round slots.</p>
        </div>
      </div>

      <div class="controls">
        <input id="searchInput" placeholder="Search IGN / class" />
        <select id="filterSelect">
          <option value="all">All roles</option>
          <option value="dispel">Dispel</option>
          <option value="fma">FMA</option>
          <option value="se">SE</option>
          <option value="th">TH</option>
          <option value="si">SI</option>
          <option value="tl">TL</option>
          <option value="smoke">Smoke</option>
        </select>
      </div>

      <form id="addPlayerForm" class="addForm">
        <input id="ignInput" placeholder="IGN" required />
        <select id="classInput"></select>
        <input id="levelInput" type="number" min="1" max="300" placeholder="Lv" />
        <div class="roundPicker" id="roundPicker"></div>
        <button type="submit">Add Player</button>
      </form>

      <div id="lobby" class="lobby dropzone" data-zone="lobby"></div>
    </aside>

    <section class="planner">
      <section class="tracker panel">
        <div>
          <h2>Character Clear Tracker</h2>
          <p>Tracks Belle + Gillian characters placed at least once.</p>
        </div>
        <div id="trackerGrid" class="trackerGrid"></div>
      </section>

      <section id="rounds" class="rounds"></section>
    </section>

    <aside class="panel insightPanel">
      <h2>Selected Round</h2>
      <select id="roundFocus"></select>
      <div id="roundInsight" class="roundInsight"></div>

      <h2>Global Issues</h2>
      <div id="globalIssues" class="globalIssues"></div>
    </aside>
  </main>

  <template id="playerCardTemplate">
    <article class="playerCard" draggable="true">
      <div class="cardTop">
        <strong class="ign"></strong>
        <span class="level"></span>
      </div>
      <div class="classLine"></div>
      <div class="badges"></div>
      <div class="availability"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
